<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flypi Hosting - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <div class="logo">🚀 Flypi Hosting</div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
  </div>
</nav>

<main class="dashboard">

  <h1>Dashboard</h1>
  <p>Manage your Discord bots from here.</p>

  <div class="cards">

    <div class="card">
      <h2>🤖 My Bots</h2>
      <p id="bot-count">Loading...</p>
    </div>

    <div id="bot-list"></div>

  </div>

  <a href="create-bot.html" class="get-started">
    ➕ Create Bot
  </a>

</main>

  <script>

async function loadBots() {

  try {

    const response = await fetch(
      "https://flypi-hosting-backend.onrender.com/bots"
    );

    const result = await response.json();

    if (!result.success) {
      throw new Error("Failed to load bots");
    }

    document.getElementById("bot-count").textContent =
      result.bots.length + " Bots";

    const botList = document.getElementById("bot-list");

    botList.innerHTML = "";

    result.bots.forEach((bot) => {

      const botCard = document.createElement("div");

      botCard.className = "card";

      botCard.innerHTML = `
        <h2>🤖 ${bot.name}</h2>

        <p>📦 ${bot.fileName}</p>

        <p>
          ${bot.status === "Running" ? "🟢 Running" : "🔴 Offline"}
        </p>

        <button onclick="startBot('${bot.id}')">
          ▶️ Start Bot
        </button>

        <button onclick="stopBot('${bot.id}')">
          ⏹️ Stop Bot
        </button>
      `;

      botList.appendChild(botCard);

    });

  } catch (error) {

    console.error(error);

    document.getElementById("bot-count").textContent =
      "Connection failed ❌";

  }

}


async function startBot(botId) {

  try {

    const response = await fetch(
      "https://flypi-hosting-backend.onrender.com/start",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          botId: botId
        })
      }
    );

    const result = await response.json();

    alert(result.message);

    if (result.success) {
      loadBots();
    }

  } catch (error) {

    console.error(error);

    alert("Server connection failed ❌");

  }

}


async function stopBot(botId) {

  try {

    const response = await fetch(
      "https://flypi-hosting-backend.onrender.com/stop",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          botId: botId
        })
      }
    );

    const result = await response.json();

    alert(result.message);

    if (result.success) {
      loadBots();
    }

  } catch (error) {

    console.error(error);

    alert("Server connection failed ❌");

  }

}


loadBots();

  </script>



</body>
</html>
