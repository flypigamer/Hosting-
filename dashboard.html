<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flypi Hosting - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <div class="logo">🚀 Flypi Hosting</div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
  </div>
</nav>

<main class="dashboard">

  <h1>Dashboard</h1>
  <p>Manage your Discord bots from here.</p>

  <div class="cards">

    <div class="card">
      <h2>🤖 My Bots</h2>
      <p id="bot-count">Loading...</p>
    </div>

    <div id="bot-list"></div>

  </div>

  <a href="create-bot.html" class="get-started">
    ➕ Create Bot
  </a>

</main>

<script>

async function loadBots() {

  try {

    const response = await fetch(
      "https://flypi-hosting-backend.onrender.com/bots"
    );

    const result = await response.json();

    if (result.success) {

      document.getElementById("bot-count").textContent =
        result.bots.length + " Bots";

      const botList = document.getElementById("bot-list");

      botList.innerHTML = "";

      result.bots.forEach((bot) => {

        const botCard = document.createElement("div");

        botCard.className = "card";

        botCard.innerHTML = `
          <h2>🤖 ${bot.name}</h2>
          <p>📦 ${bot.fileName}</p>
          <p>🔴 Offline</p>

          <button onclick="startBot()">
            ▶️ Start Bot
          </button>

          <button onclick="stopBot()">
            ⏹️ Stop Bot
          </button>
        `;

        botList.appendChild(botCard);

      });

    }

  } catch (error) {

    console.error(error);

    document.getElementById("bot-count").textContent =
      "Connection failed ❌";

  }

}


async function startBot() {

  const response = await fetch(
    "https://flypi-hosting-backend.onrender.com/start",
    {
      method: "POST"
    }
  );

  const result = await response.json();

  alert(result.message);

}


async function stopBot() {

  const response = await fetch(
    "https://flypi-hosting-backend.onrender.com/stop",
    {
      method: "POST"
    }
  );

  const result = await response.json();

  alert(result.message);

}


loadBots();

</script>

</body>
</html>
