<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flypi Hosting - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <div class="logo">🚀 Flypi Hosting</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
  </nav>

  <main class="dashboard">
    <h1>Dashboard</h1>
    <p>Manage your Discord bots from here.</p>

    <div class="cards">

      <div class="card">
        <h2>🤖 My Bots</h2>
        <p id="bot-count">0 Bots</p>
      </div>

      <div class="card">
        <h2>💾 Storage</h2>
        <p>0 MB Used</p>
      </div>

      <div class="card">
        <h2>🟢 Status</h2>
        <p id="bot-status">Offline</p>
      </div>
      <div class="bot-controls">

  <button onclick="startBot()">▶️ Start Bot</button>

  <button onclick="stopBot()">⏹️ Stop Bot</button>

      </div>

    <a href="create-bot.html" class="get-started">Create Bot</a>
  </main>
  <script>
  function startBot() {
    document.getElementById("bot-status").textContent = "Running";
    alert("Bot started! 🚀");
  }

  function stopBot() {
    document.getElementById("bot-status").textContent = "Offline";
    alert("Bot stopped.");
  }
  </script>

</body>
</html>
