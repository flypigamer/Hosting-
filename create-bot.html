<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flypi Hosting - Create Bot</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <div class="logo">🚀 Flypi Hosting</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
  </nav>

  <main class="create-bot">
    <h1>Create Your Bot</h1>

    <p>Set up your Discord bot</p>

    <div class="form-box">

      <label for="bot-name">Bot Name</label>

      <input
        type="text"
        id="bot-name"
        placeholder="Enter bot name"
      >

      <label for="bot-file">Bot Files</label>

      <input
        type="file"
        id="bot-file"
      >

      <button onclick="createBot()">Create Bot</button>

    </div>
  </main>

<script>
  async function createBot() {
    const botName = document.getElementById("bot-name").value;
    const botFile = document.getElementById("bot-file").files[0];

    if (botName === "") {
      alert("Please enter a bot name.");
      return;
    }

    if (!botFile) {
      alert("Please select your bot file.");
      return;
    }

    try {
      const response = await fetch(
        "https://flypi-hosting-backend.onrender.com/"
      );

      const result = await response.text();

      alert(
        "Backend Connected! 🚀\n\n" +
        "Bot: " + botName + "\n" +
        "File: " + botFile.name + "\n\n" +
        result
      );

    } catch (error) {
      alert("Backend connection failed ❌");
      console.error(error);
    }
  }
</script>
</body>
</html>
